<div class="admin-layout">

  <aside class="sidebar">

    <div class="admin-logo">

      <div class="logo">
        TIG<span>AUTO</span>
      </div>

      <small>
        ADMIN PORTAL
      </small>

    </div>


    <nav class="admin-navigation">

      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
      >
        <span>▦</span>
        Dashboard
      </a>


      <a
        routerLink="/admin/cars"
        routerLinkActive="active"
      >
        <span>🚗</span>
        Vehicles
      </a>


      <a
        routerLink="/admin/cars/add"
        routerLinkActive="active"
      >
        <span>＋</span>
        Add Vehicle
      </a>

    </nav>


    <div class="sidebar-bottom">

      <a routerLink="/">
        ← Back to website
      </a>

    </div>

  </aside>


  <div class="admin-main">

    <header class="admin-header">

      <div>

        <span class="mobile-brand">
          TIGAUTO
        </span>

      </div>

      <div class="admin-user">

        <div class="admin-avatar">
          A
        </div>

        <div>
          <strong>
            Administrator
          </strong>

          <span>
            TIGAUTO Admin
          </span>
        </div>

      </div>

    </header>


    <div class="admin-content">

      <router-outlet />

    </div>

  </div>

</div>
